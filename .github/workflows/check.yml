name: 桂电美食分享 · Web CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run guide:build
      - run: npm test
      - run: npm run check
      - name: Focused interface review (CI only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node test/ui-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-review
          path: artifacts/*.png
